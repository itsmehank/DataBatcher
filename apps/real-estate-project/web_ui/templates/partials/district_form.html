<form id="districtForm">
    <div class="field-grid {{ district_grid_class|default('two-col') }}">
        <div class="field-block field-span-2">
            <label for="district_target_ymd">분석 기준 년월</label>
            <input type="month" id="district_target_ymd" required>
        </div>
        <div class="field-block">
            <label for="district_gu">구 선택</label>
            <select id="district_gu" required>
                <option value="">구를 선택하세요</option>
                {% for gu in gu_list %}
                <option value="{{ gu }}">{{ gu }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field-block">
            <label for="district_name">동 선택 (선택)</label>
            <select id="district_name" disabled>
                <option value="">전체 동 (구만 선택시)</option>
            </select>
        </div>
        <div class="field-block">
            <label for="district_top_n">상위 개수</label>
            <input type="number" id="district_top_n" value="10" min="1" max="10">
        </div>
        <div class="field-block">
            <label for="district_analysis_period">분석 기간 (개월)</label>
            <select id="district_analysis_period">
                <option value="3">3개월</option>
                <option value="6" selected>6개월</option>
                <option value="12">12개월</option>
            </select>
        </div>
    </div>
    <div class="submit-row">
        <div class="submit-note">구만 선택하면 구 전체, 동까지 고르면 더 집중된 결과를 봅니다.</div>
        <button type="submit" class="primary-btn"><i class="fas fa-search-location"></i> 특정 지역 분석</button>
    </div>
</form>

<div id="districtLoading" class="loading text-center py-4">
    <div class="spinner-border" role="status"><span class="visually-hidden">분석 중...</span></div>
    <p class="mt-3 mb-0">선택한 지역을 분석 중입니다...</p>
</div>
<div id="districtFeedback" class="inline-feedback"></div>
