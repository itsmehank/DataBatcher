# backfill_indicators.sample.yaml
#
# "추가 지표 백필" 기능에서 사용할 전용 설정 파일 예시입니다.
# 기존 config/settings.yaml의 indicators.pipeline 구조와 호환됩니다.
#
indicators:
  pipeline:
    - name: rsi
      params:
        window: 14
        column: close
      save: true

    - name: sma
      params:
        window: 50
        column: close
      save: true
