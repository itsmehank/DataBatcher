# DataBatcher runtime configuration (skeleton)

database:
  # 예: mysql+pymysql://user:pass@host:3306/market?charset=utf8mb4
  url: mysql+pymysql://USER:PASS@HOST:3306/market?charset=utf8mb4
  pool_size: 10
  max_overflow: 20
  pool_recycle: 1800
  pool_pre_ping: true

runtime:
  timezone: Asia/Seoul
  thread_workers: 8
  batch_size: 2000
  rate_limit_per_sec: 5
  jitter: true
  retry:
    max_attempts: 5
    backoff_base_sec: 1
    backoff_max_sec: 30

markets:
  close_times:
    XKRX: "16:00"
    NYSE: "16:00"
  safe_delay_minutes: 30
  us_daily_cutoff: "18:00"

indicators:
  materialization:
    mode: long      # long | wide | none | hybrid
    table_long: stock_indicators
    attach_to_price:
      prefix: ind_
  pipeline:
    - name: sma
      params: { window: 50, column: close }
      save: true
    - name: sma
      params: { window: 100, column: close }
      save: true
    - name: sma
      params: { window: 150, column: close }
      save: true
    - name: sma
      params: { window: 200, column: close }
      save: true
  warmup_override:
    ema: 10x_window
    rsi: 5x_window

indicators_weekly:
  materialization:
    mode: long
    table_long: stock_indicators_weekly
  pipeline:
#    - name: sma
#      params: { window: 20, column: close }
#      save: true
#    - name: sma
#      params: { window: 50, column: close }
#      save: true
#    - name: sma
#      params: { window: 100, column: close }
#      save: true
#    - name: sma
#      params: { window: 200, column: close }
#      save: true
#    - name: ema
#      params: { window: 21, column: close }
#      save: true
  warmup_override:
    ema: 10x_window
    rsi: 5x_window

resync:
  enabled: true
  detect_split_threshold: 0.6
  monthly_full_check: true
  full_check_day: 1

