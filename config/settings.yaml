# --------------------------------------------
# IBD RS Rating / RS Line / Blue Dot (KR/US 공용)
# --------------------------------------------
ibd_rs:
  strict_12m: true          # 12개월 미만 종목 제외 (IBD 원칙)
  rs_rating_weights:        # 기간별 가중치
    3m: 0.4
    6m: 0.2
    9m: 0.2
    12m: 0.2
  blue_dot_lookback: 252    # Blue Dot 52주 lookback
  us_price_column: adj_close  # US RS 계산용 가격 컬럼 (adj_close 권장, NULL이면 close fallback)
  benchmarks:
    kr: "1001"              # KOSPI 지수 심볼
    us: "US500"             # S&P 500 지수 심볼

indicators_us_weekly:
