# --------------------------------------------
# Minervini Trend Template Screening (KR)
# --------------------------------------------
minervini_kr:
  filters:
    ma_ordering:
      enabled: true                # price > sma50 > sma150 > sma200
    sma200_uptrend:
      enabled: true
      lookback: 22                 # 200일선이 22거래일 전보다 높음
    price_above_52w_low:
      enabled: true
      pct: 1.3                     # 52주 저가 대비 130% 이상
    price_near_52w_high:
      enabled: true
      pct: 0.75                    # 52주 고가의 75% 이상
    rs_rating:
      enabled: true
      min: 80                      # RS Rating 80 이상
    blue_dot:
      enabled: false               # Blue Dot 필터 (선택적)
  lookback_52w: 252                # 52주 = 252 거래일

# --------------------------------------------
# Minervini Trend Template Screening (US)
# --------------------------------------------
minervini_us:
  price_column: adj_close          # US Minervini 가격 필터 입력 컬럼 (adj_close 우선, NULL이면 close fallback)
  filters:
    ma_ordering:
      enabled: true                # price > sma50 > sma150 > sma200
    sma200_uptrend:
      enabled: true
      lookback: 22                 # 200일선이 22거래일 전보다 높음
    price_above_52w_low:
      enabled: true
      pct: 1.3                     # 52주 저가 대비 130% 이상
    price_near_52w_high:
      enabled: true
      pct: 0.75                    # 52주 고가의 75% 이상
    rs_rating:
      enabled: true
      min: 80                      # RS Rating 80 이상
    blue_dot:
      enabled: false               # Blue Dot 필터 (선택적)
  lookback_52w: 252                # 52주 = 252 거래일
