version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: databatche_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-market}
      MYSQL_USER: ${MYSQL_USER:-CHANGE_ME_DB_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
